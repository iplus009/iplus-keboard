name: Android build

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable-debug:
    name: Build iPlus Keyboard APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653"

      - name: Build stable debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleStableDebug

      - name: Prepare universal APK for direct download
        id: pkg
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' build.gradle | head -n1)"
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not determine versionName from build.gradle"
            exit 1
          fi
          mkdir -p dist
          echo "Available APK outputs:"
          find build/outputs/apk/stable/debug -maxdepth 1 -type f -name '*.apk' -print
          APK="$(find build/outputs/apk/stable/debug -maxdepth 1 -type f -iname '*universal*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "Universal APK not found; refusing to publish an ABI-specific build as universal."
            exit 1
          fi
          OUT_APK="dist/iPlus-Keyboard-v${VERSION_NAME}.apk"
          cp "$APK" "$OUT_APK"
          ls -lh "$OUT_APK"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk=$OUT_APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iplus-universal-apk
          path: ${{ steps.pkg.outputs.apk }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download on GitHub Releases
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work/iplus-keyboard-implementation')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: iPlus v${{ steps.pkg.outputs.version }}
          body: |
            iPlus v${{ steps.pkg.outputs.version }} release.

            - Branded app name updated to iPlus across launcher, setup, and settings
            - Redesigned seamless adaptive & monochrome i+ launcher icon (boxless Nothing Matte blend, removed legacy AOSP/FUTO logos)
            - Enabled APK v1 + v2 + v3 signature schemes for wider Android package-installer compatibility
            - Includes crash, stuck-key, voice input, emoji, clipboard, and UI stability fixes
          files: ${{ steps.pkg.outputs.apk }}
          prerelease: false
          make_latest: true
