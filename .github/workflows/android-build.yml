name: Android build

on:
  push:
    branches:
      - "work/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable-debug:
    name: Build stable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Build stable debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleStableDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iplus-keyboard-stable-debug
          path: build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error
          retention-days: 14
