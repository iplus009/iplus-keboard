name: Android build

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable-debug:
    name: Build Keybird APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653"

      - name: Build stable debug APK
        env:
          KEYBIRD_GOOGLE_WEB_CLIENT_ID: ${{ secrets.KEYBIRD_GOOGLE_WEB_CLIENT_ID }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleStableDebug

      - name: Prepare universal APK for direct download
        id: pkg
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' build.gradle | head -n1)"
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not determine versionName from build.gradle"
            exit 1
          fi
          mkdir -p dist
          echo "Available APK outputs:"
          find build/outputs/apk/stable/debug -maxdepth 1 -type f -name '*.apk' -print
          APK="$(find build/outputs/apk/stable/debug -maxdepth 1 -type f -iname '*universal*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "Universal APK not found; refusing to publish an ABI-specific build as universal."
            exit 1
          fi
          OUT_APK="dist/Keybird-v${VERSION_NAME}.apk"
          cp "$APK" "$OUT_APK"
          ls -lh "$OUT_APK"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk=$OUT_APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: keybird-universal-apk
          path: ${{ steps.pkg.outputs.apk }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download on GitHub Releases
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work/iplus-keyboard-implementation')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Keybird v${{ steps.pkg.outputs.version }}
          body: |
            Keybird v${{ steps.pkg.outputs.version }} release.

            - Expanded Keybird Store (`660+` live Themes, Fonts & Sticker Packs) with `#5-digit` code search, category filters, and preview tabs (`English`, `বাংলা`, `123`)
            - Added `My Stickers` custom local sticker pack creator (PNG/WebP/JPG) + animated WebP sticker picker & editor MIME validation
            - Upgraded Store Theme rendering engine (`glass`, `motion`, `live`, `ceramic_3d`, `pill`, `bauhaus_cycle`) with high-contrast Enter/Search icons, auto-healed spacebar palettes, and inset rounded key hints
            - Added Google One-Tap + Supabase account entitlement sync, offline Ed25519/AES-256-GCM vault, and Keybird v4.1.2 Studio UI refinements
          files: ${{ steps.pkg.outputs.apk }}
          prerelease: false
          make_latest: true
