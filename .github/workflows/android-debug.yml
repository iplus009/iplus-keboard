name: Android debug build

on:
  push:
    branches:
      - work/iplus-keyboard-implementation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Build stable debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleStableDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: iplus-keyboard-stable-debug
          path: build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error
