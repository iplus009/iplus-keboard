<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">iPlus Keyboard</title>
  <desc id="desc">Minimal professional iPlus keyboard icon featuring an i+ emblem above clean keyboard keys.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- Base rounded keycap / app icon container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)" stroke="#334155" stroke-width="8"/>

  <!-- Minimal Keyboard Frame -->
  <rect x="76" y="76" width="360" height="360" rx="56" fill="#0B1120" stroke="#1E293B" stroke-width="6"/>

  <!-- Crisp "i" mark -->
  <circle cx="196" cy="148" r="21" fill="#F8FAFC"/>
  <rect x="176" y="186" width="40" height="106" rx="14" fill="#F8FAFC"/>

  <!-- Crisp "+" mark -->
  <rect x="292" y="176" width="36" height="108" rx="12" fill="url(#accent)"/>
  <rect x="256" y="212" width="108" height="36" rx="12" fill="url(#accent)"/>

  <!-- Minimal Keyboard Keycap Row -->
  <rect x="108" y="324" width="52" height="30" rx="8" fill="#1E293B" stroke="#334155" stroke-width="3"/>
  <rect x="170" y="324" width="52" height="30" rx="8" fill="#1E293B" stroke="#334155" stroke-width="3"/>
  <rect x="232" y="324" width="52" height="30" rx="8" fill="#1E293B" stroke="#334155" stroke-width="3"/>
  <rect x="294" y="324" width="52" height="30" rx="8" fill="#1E293B" stroke="#334155" stroke-width="3"/>
  <rect x="356" y="324" width="48" height="30" rx="8" fill="#1E293B" stroke="#334155" stroke-width="3"/>

  <!-- Minimal Spacebar -->
  <rect x="156" y="368" width="200" height="28" rx="9" fill="#0F172A" stroke="#38BDF8" stroke-width="3.5"/>
</svg>
