<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Keybird</title>
  <desc id="desc">Keybird emblem featuring a stylized gradient songbird in violet head, magenta-to-amber sweeping wing, and blue-violet tail feathers on midnight navy.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1B7A" />
      <stop offset="50%" stop-color="#050A3E" />
      <stop offset="100%" stop-color="#02041E" />
    </linearGradient>
    <linearGradient id="headGrad" x1="150" y1="90" x2="290" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B21B6" />
      <stop offset="55%" stop-color="#7E22CE" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="125" y1="180" x2="395" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E11D74" />
      <stop offset="52%" stop-color="#F43F5E" />
      <stop offset="82%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#FDBA74" />
    </linearGradient>
    <linearGradient id="tailGrad" x1="190" y1="300" x2="390" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="55%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#243594" stroke-width="3" />

  <g transform="translate(0, -18)">
    <!-- Head & Beak -->
    <path d="M148,166 C140,118 184,78 232,96 C250,103 268,108 292,115 C262,126 240,148 250,180 C214,182 178,176 148,166 Z" fill="url(#headGrad)" />
    <!-- Sweeping Wing -->
    <path d="M138,164 C178,200 232,190 278,198 C326,206 346,274 374,312 C384,326 396,328 398,320 C390,342 360,346 322,324 C272,296 226,274 176,262 C140,252 126,214 138,164 Z" fill="url(#wingGrad)" />
    <!-- Upper Speed Tail Feather -->
    <path d="M188,282 C252,306 298,354 342,356 C366,357 386,348 396,336 C382,368 350,382 316,368 C274,350 234,316 188,282 Z" fill="url(#tailGrad)" />
    <!-- Lower Speed Tail Feather -->
    <path d="M198,308 C244,344 274,384 316,388 C336,390 352,384 360,376 C348,402 318,412 290,398 C256,380 228,344 198,308 Z" fill="url(#tailGrad)" />
  </g>

  <text x="256" y="446" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">Keybird</text>
</svg>
